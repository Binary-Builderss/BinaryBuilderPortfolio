<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BinaryBuilders | Software engineering studio</title>
  <meta name="description" content="BinaryBuilders is a two-engineer studio building Java backends, React and Next.js apps, Salesforce automation, and the integrations between them.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://binarybuilders.dev/">
  <script type="application/ld+json">
    {"@context": "https://schema.org", "@type": "Organization", "name": "BinaryBuilders", "url": "https://binarybuilders.dev", "logo": "https://binarybuilders.dev/assets/apple-touch-icon.png"}
  </script>
  <meta property="og:title" content="BinaryBuilders">
  <meta property="og:description" content="Backend, web, Salesforce and integration work from a focused two-engineer team.">
  <meta property="og:url" content="https://binarybuilders.dev">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://binarybuilders.dev/assets/geometry-dark.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <canvas class="bits" aria-hidden="true"></canvas>

  <header class="top wrap">
    <a class="brand" href="/">
      <picture>
        <source srcset="assets/logo-white.png" media="(prefers-color-scheme: dark)">
        <img src="assets/logo-black.png" alt="BinaryBuilders" width="480" height="109">
      </picture>
    </a>
  </header>

  <main class="hero wrap">
    <h1 class="decode">Build. Automate. Scale.</h1>
    <div class="ctas">
      <!-- contactus@ is forwarded by Cloudflare Email Routing. -->
      <a class="btn btn-primary btn-lg" href="mailto:contactus@binarybuilders.dev">contactus@binarybuilders.dev</a>
      <button class="btn btn-ghost btn-lg" type="button" data-open-call>Call us</button>
    </div>
  </main>

  <footer class="footer wrap">
    <p>Software engineering studio<br>Java, Go, C#, C++, React, Next.js, Salesforce</p>
    <p>binarybuilders.dev<br>&copy; 2026 BinaryBuilders</p>
  </footer>

  <!-- Opened by main.js, which also builds the tel: links so the numbers are not in this file. -->
  <dialog id="call" class="call" closedby="any" aria-labelledby="call-title">
    <h2 id="call-title">Who would you like to call?</h2>
    <div class="call-options">
      <button class="btn btn-ghost btn-lg" type="button" data-call="giuseppe">Giuseppe Scappaticci</button>
      <button class="btn btn-ghost btn-lg" type="button" data-call="michele">Michele Sabatino</button>
    </div>
    <form method="dialog"><button class="btn btn-sm">Cancel</button></form>
  </dialog>
</body>
</html>
